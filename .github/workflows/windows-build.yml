
name: Build Windows POS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.6

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      # Create ZIP
      - name: Create Windows ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "build\windows\x64\runner\Release\*" `
            -DestinationPath "POS-System.zip" `
            -Force

      # Install Inno Setup
      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed"
          }

      # Create EXE Installer
      - name: Create Windows Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found: $iscc"
          }

          & $iscc installer.iss

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup compilation failed"
          }

          if (!(Test-Path "installer_output\POS-Setup.exe")) {
            throw "POS-Setup.exe was not created"
          }

      # Upload ZIP
      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: POS-Windows-ZIP
          path: POS-System.zip

      # Upload Installer
      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: POS-Windows-Installer
          path: installer_output/POS-Setup.exe

      # Create GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: POS System v1.0.${{ github.run_number }}
          files: |
            POS-System.zip
            installer_output/POS-Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
